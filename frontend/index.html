<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TourGuide DSS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0b8cd9;
      --primary-dark: #0a6fad;
      --accent: #f5f7fb;
      --text: #0f172a;
      --muted: #6b7280;
      --card: #ffffff;
      --border: #e2e8f0;
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--accent);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.3px;
      font-size: 18px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid transparent;
    }

    .nav-links a.active, .nav-links a:hover {
      color: var(--primary);
      border-color: var(--border);
      background: #f8fafc;
    }

    header.hero {
      position: relative;
      overflow: hidden;
      background: #0c1c2e;
      color: white;
      padding: 70px 24px 80px;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      opacity: 0.38;
    }

    .hero-content {
      position: relative;
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .hero h1 {
      margin: 0;
      max-width: 820px;
      font-size: clamp(32px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .hero p {
      margin: 0;
      max-width: 720px;
      color: rgba(255,255,255,0.92);
      font-size: 16px;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    main.container {
      max-width: 1180px;
      margin: -60px auto 80px;
      padding: 0 22px;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 1000px) {
      .layout { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .card:hover { transform: translateY(-2px); box-shadow: 0 20px 40px rgba(15,23,42,0.12); }
    .card h2 { margin-top: 0; font-size: 20px; }
    .card h3 { margin-bottom: 8px; }

    label { font-weight: 600; display: block; margin-bottom: 6px; color: var(--muted); }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 14px;
      margin-bottom: 12px;
      background: #f8fafc;
    }

    .inline-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }

    button {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.05s ease, box-shadow 0.1s ease, background 0.2s ease;
      box-shadow: 0 12px 20px rgba(14, 165, 233, 0.25);
    }

    button:hover { background: var(--primary-dark); }
    button:active { transform: translateY(1px); box-shadow: 0 6px 12px rgba(14, 165, 233, 0.25); }

    .status { margin-top: 6px; font-weight: 600; }
    .status.error { color: #dc2626; }
    .status.success { color: #0ea5e9; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #475569;
      font-weight: 600;
      font-size: 13px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }

    .chip {
      border: 1px solid var(--border);
      background: #fff;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 600;
      color: var(--muted);
      box-shadow: 0 6px 16px rgba(15,23,42,0.05);
    }

    .pill.strong { background: rgba(11,140,217,0.12); color: var(--primary); }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 12px 0 16px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .tour-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: white;
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.08);
      display: grid;
      grid-template-rows: 160px 1fr;
      overflow: hidden;
    }

    .tour-img {
      background-size: cover;
      background-position: center;
    }

    .tour-body {
      padding: 14px 16px;
      display: grid;
      gap: 8px;
    }

    .tour-title { font-weight: 800; font-size: 16px; margin: 0; }
    .tour-meta { color: var(--muted); font-size: 13px; }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 700;
      font-size: 12px;
      margin-right: 6px;
    }

    .score {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      color: #0ea5e9;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    th, td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      background: white;
    }

    th { background: #f8fafc; }
    .muted { color: var(--muted); font-size: 13px; }

    .weights {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .weights label { font-weight: 600; color: var(--muted); }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
